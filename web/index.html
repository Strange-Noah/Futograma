<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Futograma · 足球比赛记录</title><link rel="stylesheet" href="style.css"></head><body>
<header><a class="brand" href="./">Futograma<span>足球比赛记录</span></a><p id="reference">读取数据…</p></header>
<div class="shell"><aside aria-label="球队及球员"><div class="aside-heading"><h2>球队</h2><span>6 CLUBS</span></div><p class="hint">展开球队，选择球员</p><nav id="teams"></nav><label class="history-toggle"><input id="history" type="checkbox"> 显示历史关联与待核实球员</label><p class="hint">默认仅列出有证据支持、当前由俱乐部管理竞技负荷的球员。历史关联不等于当前成员。</p></aside>
<main><div class="breadcrumb" id="breadcrumb">球队 / 球员 / 比赛记录</div><h1 id="player-name">从一名球员开始</h1><p id="player-context">在左侧展开球队，查看球员的原始比赛记录。</p><div id="message" role="status"></div><div class="table-wrap"><table><caption id="caption">比赛明细</caption><thead><tr><th>比赛日期</th><th>赛事</th><th>对手</th><th>代表俱乐部</th><th>出场分钟</th><th>来源 / 核验状态</th></tr></thead><tbody id="records"><tr><td colspan="6" class="empty">请选择球队与球员</td></tr></tbody></table></div><p class="legend">0 = 已记录的确认零分钟；— = 分钟未知或未核实；待来源 = 尚未确认球员是否入选该队比赛名单。</p><footer>仅展示已迁移的俱乐部比赛事实，不代表完整个人比赛负荷。测试数据集中的名单修订尚未写入生产基线。<p id="version"></p></footer></main></div><script type="module" src="app.js"></script></body></html>
