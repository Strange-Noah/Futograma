{
  "name": "Portable regression checks",
  "on": {
    "push": {},
    "pull_request": {},
    "workflow_dispatch": {}
  },
  "permissions": {
    "contents": "read"
  },
  "jobs": {
    "test": {
      "runs-on": "ubuntu-latest",
      "timeout-minutes": 15,
      "env": {
        "PYTHONDONTWRITEBYTECODE": "1"
      },
      "steps": [
        {
          "name": "Checkout official action v6",
          "uses": "actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803",
          "with": {
            "persist-credentials": false
          }
        },
        {
          "name": "Python 3.14 official action v6",
          "uses": "actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1",
          "with": {
            "python-version": "3.14"
          }
        },
        {
          "name": "Install dependency contract (stdlib runtime)",
          "run": "python -m pip install --disable-pip-version-check -r requirements-cloud.txt"
        },
        {
          "name": "Portable synthetic-fixture tests (no production DB required)",
          "run": "python -m unittest discover -s tests/cloud -v"
        },
        {
          "name": "Verify no forbidden files tracked",
          "run": "python ops/repository/check_tracked.py"
        }
      ]
    }
  }
}
