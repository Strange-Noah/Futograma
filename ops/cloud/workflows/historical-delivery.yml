{
  "name": "Isolated historical database delivery",
  "on": {
    "push": {
      "branches": [
        "codex/historical-cloud-handoff-20261125"
      ],
      "paths": [
        "historical-batch-request.json"
      ]
    },
    "workflow_dispatch": {
      "inputs": {
        "mode": {
          "type": "choice",
          "options": [
            "verify"
          ],
          "default": "verify",
          "required": true
        }
      }
    }
  },
  "permissions": {
    "contents": "read"
  },
  "concurrency": {
    "group": "historical-data-${{ github.ref }}",
    "cancel-in-progress": false
  },
  "jobs": {
    "delivery": {
      "runs-on": "ubuntu-latest",
      "timeout-minutes": 35,
      "permissions": {
        "contents": "write"
      },
      "steps": [
        {
          "uses": "actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803",
          "with": {
            "persist-credentials": false,
            "fetch-depth": 2
          }
        },
        {
          "name": "Validate historical inputs and expected parent",
          "id": "input",
          "env": {
            "BEFORE": "${{ github.event.before }}",
            "GH_TOKEN": "${{ github.token }}"
          },
          "run": "set -euo pipefail\ntest \"$GITHUB_REPOSITORY\" = 'Strange-Noah/Futograma-data'\n[[ \"$GITHUB_REF\" == refs/heads/codex/historical-* ]]\ntest \"$(jq -r .data_ref historical-handoff.json)\" = \"${GITHUB_REF#refs/heads/}\"\nbase=$(jq -er '.code_commit | select(test(\"^[0-9a-f]{40}$\"))' historical-handoff.json)\nprintf 'base=%s\\n' \"$base\" >> \"$GITHUB_OUTPUT\"\nif [ \"$GITHUB_EVENT_NAME\" = push ]; then\n  test \"$GITHUB_RUN_ATTEMPT\" = 1\n  test \"$(git diff-tree --no-commit-id --name-only -r \"$GITHUB_SHA\")\" = historical-batch-request.json\n  jq -e --arg before \"$BEFORE\" '.mode==\"deliver\" and .expected_parent==$before and (.unit|test(\"^[0-9]+:[0-9]{4}/[0-9]{2}-H[12]$\")) and ((.scope // \"all\") | IN(\"all\",\"national\")) and (.code_commit|test(\"^[0-9a-f]{40}$\"))' historical-batch-request.json >/dev/null\n  test \"$(gh api \"repos/$GITHUB_REPOSITORY/git/ref/heads/${GITHUB_REF#refs/heads/}\" --jq .object.sha)\" = \"$GITHUB_SHA\"\n  printf 'code=%s\\n' \"$(jq -r .code_commit historical-batch-request.json)\" >> \"$GITHUB_OUTPUT\"\nfi"
        },
        {
          "uses": "actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803",
          "with": {
            "repository": "Strange-Noah/Futograma",
            "ref": "${{ steps.input.outputs.base }}",
            "path": "handoff-code",
            "persist-credentials": false
          }
        },
        {
          "uses": "actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803",
          "if": "${{ github.event_name == 'push' }}",
          "with": {
            "repository": "Strange-Noah/Futograma",
            "ref": "${{ steps.input.outputs.code }}",
            "path": "execution-code",
            "persist-credentials": false
          }
        },
        {
          "uses": "actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1",
          "with": {
            "python-version": "3.14"
          }
        },
        {
          "name": "Require exact-source CI",
          "if": "${{ github.event_name == 'push' }}",
          "working-directory": "execution-code",
          "env": {
            "EXPECTED_CODE_SHA": "${{ steps.input.outputs.code }}"
          },
          "run": "python -B - <<'PY'\nimport json\nimport os\nimport subprocess\nfrom urllib.request import urlopen\n\nfrom squad_pipeline.cloud.release_gate import require_ci\n\nsha = os.environ['EXPECTED_CODE_SHA']\nif subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip() != sha:\n    raise ValueError('EXECUTED_CODE_COMMIT_MISMATCH')\nurl = 'https://api.github.com/repos/Strange-Noah/Futograma/actions/runs?head_sha=' + sha + '&per_page=100'\nwith urlopen(url, timeout=30) as result:\n    print('Historical CI:', require_ci(json.load(result)['workflow_runs'], sha))\nPY"
        },
        {
          "name": "Resume, audit, and atomically publish the verified historical state",
          "if": "${{ github.event_name == 'push' }}",
          "working-directory": "execution-code",
          "env": {
            "GH_TOKEN": "${{ github.token }}",
            "PYTHONPATH": "${{ github.workspace }}/execution-code"
          },
          "run": "set -euo pipefail\npython -B -m ops.cloud.historical_delivery --request ../historical-batch-request.json --entry ../historical-handoff.json --base-checkout ../handoff-code"
        },
        {
          "name": "Independently verify the selected snapshot",
          "if": "${{ github.event_name == 'workflow_dispatch' }}",
          "working-directory": "handoff-code",
          "env": {
            "GH_TOKEN": "${{ github.token }}"
          },
          "run": "python -B -m ops.cloud.verify_historical_handoff --entry ../historical-handoff.json --output .restore-check"
        }
      ]
    }
  }
}
